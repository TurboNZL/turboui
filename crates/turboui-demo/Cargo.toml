[package]
name = "turboui-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
gpui = ["dep:turboui-gpui"]
headless = ["gpui", "turboui-gpui/headless"]

[dev-dependencies]
tiny-skia = "0.11"

[dependencies]
turboui-core = { path = "../turboui-core" }
turboui-raster = { path = "../turboui-raster" }
turboui-gpui = { path = "../turboui-gpui", optional = true }
