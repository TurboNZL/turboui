[package]
name = "turboui-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TurboUI desktop backend: draws a scene with GPUI (through GPUI Kit)."

[features]
default = []
# Offscreen rendering for tests (needs a Vulkan driver; software lavapipe works).
headless = ["gpui-kit/test-support"]

[dependencies]
turboui-core = { path = "../turboui-core" }
gpui-kit = "0.10"
turboui-raster = { path = "../turboui-raster" }
image = { version = "0.25", default-features = false }
smallvec = "1"
