[workspace]
resolver = "2"
members = ["crates/turboui-core", "crates/turboui-raster", "crates/turboui-gpui", "crates/turboui-demo"]
# The GPUI backend is a heavy build; plain `cargo test` needs no GPU stack (the demo only pulls GPUI with --features gpui).
default-members = ["crates/turboui-core", "crates/turboui-raster", "crates/turboui-demo"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
