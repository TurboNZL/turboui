[workspace]
resolver = "2"
members = ["crates/turboui-core", "crates/turboui-raster", "crates/turboui-gpui", "crates/turboui-demo"]
# The GPUI backend is a heavy build; plain `cargo test` needs no GPU stack (the demo only pulls GPUI with --features gpui).
default-members = ["crates/turboui-core", "crates/turboui-raster", "crates/turboui-demo"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# The software glass is per-pixel work; an unoptimised debug build made every click take about a second.
[profile.dev.package.turboui-core]
opt-level = 3
[profile.dev.package.turboui-raster]
opt-level = 3
[profile.dev.package.turboui-gpui]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
